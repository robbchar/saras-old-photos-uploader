version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    # Exact pin is deliberate; see docs/decisions/QUOTA-AND-RUNS.md.
    ignore:
      - dependency-name: internetarchive
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /upload_page
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      upload-page:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
